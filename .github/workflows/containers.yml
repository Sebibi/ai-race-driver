name: Container images

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    paths:
      - .devcontainer/**
      - .github/workflows/containers.yml
      - Dockerfile
      - README.md
      - pyproject.toml
      - src/**
      - uv.lock
  push:
    branches:
      - master
    paths:
      - .devcontainer/**
      - .github/workflows/containers.yml
      - Dockerfile
      - README.md
      - pyproject.toml
      - src/**
      - uv.lock
  workflow_dispatch:
    inputs:
      ref:
        description: Git branch, tag, or commit to publish
        required: true
        default: master
        type: string

permissions:
  attestations: write
  contents: read
  id-token: write
  packages: write

concurrency:
  group: containers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: ghcr.io/sebibi/ai-race-driver

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - cpu
          - cuda13
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.ref || github.sha }}

      - name: Resolve source metadata and image tags
        id: source
        env:
          EVENT_BRANCH: ${{ github.head_ref || github.ref_name }}
          REQUESTED_REF: ${{ inputs.ref }}
        run: |
          revision="$(git rev-parse HEAD)"
          message="$(git log -1 --format=%s)"
          branch="${EVENT_BRANCH}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            branch="${REQUESTED_REF}"
          fi
          {
            echo "revision=${revision}"
            echo "message=${message}"
            echo "branch=${branch}"
            echo "tags<<EOF"
            echo "${IMAGE_NAME}:${{ matrix.target }}-git-${revision}"
            if [[ "${{ github.event_name }}" == "push" && "${GITHUB_REF_NAME}" == "master" ]]; then
              echo "${IMAGE_NAME}:${{ matrix.target }}"
            fi
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - uses: docker/setup-buildx-action@v3

      - name: Build image for validation
        uses: docker/build-push-action@v6
        with:
          build-args: |
            VCS_BRANCH=${{ steps.source.outputs.branch }}
            VCS_COMMIT_MESSAGE=${{ steps.source.outputs.message }}
            VCS_REVISION=${{ steps.source.outputs.revision }}
          cache-from: type=gha,scope=${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=${{ matrix.target }}
          context: .
          load: true
          platforms: linux/amd64
          push: false
          tags: ai-race-driver:${{ matrix.target }}-test
          target: ${{ matrix.target }}

      - name: Verify installed environment
        env:
          TARGET: ${{ matrix.target }}
        run: |
          image="ai-race-driver:${TARGET}-test"
          docker run --rm "${image}" python --version
          docker run --rm "${image}" ai-race-train --help
          if [[ "${TARGET}" == "cpu" ]]; then
            docker run --rm "${image}" python -c \
              'import jax; assert jax.default_backend() == "cpu", jax.devices()'
          else
            docker run --rm --env JAX_PLATFORMS=cpu "${image}" python -c \
              'from importlib.metadata import version; assert version("jax") == version("jax-cuda13-plugin"); print(version("jax-cuda13-pjrt"))'
          fi
          docker run --rm --env JAX_PLATFORMS=cpu "${image}" \
            ai-race-benchmark --num-envs 2 --num-steps 2

      - name: Run CPU training and checkpoint smoke test
        if: matrix.target == 'cpu'
        run: |
          volume="ai-race-driver-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker volume create "${volume}"
          trap 'docker volume rm "${volume}"' EXIT
          docker run --rm \
            --env WANDB_API_KEY=test-key \
            --env WANDB_ENTITY=test-entity \
            --env WANDB_MODE=disabled \
            --env WANDB_PROJECT=test-project \
            --mount "source=${volume},target=/outputs" \
            ai-race-driver:cpu-test \
            ai-race-train \
              --eval-episodes 1 \
              --log-every-updates 1 \
              --num-envs 8 \
              --num-steps 8 \
              --output /outputs/run \
              --total-timesteps 128 \
              --video-every-evals 0
          docker run --rm \
            --mount "source=${volume},target=/outputs" \
            ai-race-driver:cpu-test \
            ai-race-eval --checkpoint /outputs/run --episodes 1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          password: ${{ secrets.GITHUB_TOKEN }}
          registry: ghcr.io
          username: ${{ github.actor }}

      - name: Publish image
        if: github.event_name != 'pull_request'
        id: publish
        uses: docker/build-push-action@v6
        with:
          build-args: |
            VCS_BRANCH=${{ steps.source.outputs.branch }}
            VCS_COMMIT_MESSAGE=${{ steps.source.outputs.message }}
            VCS_REVISION=${{ steps.source.outputs.revision }}
          cache-from: type=gha,scope=${{ matrix.target }}
          context: .
          platforms: linux/amd64
          provenance: mode=max
          push: true
          sbom: true
          tags: ${{ steps.source.outputs.tags }}
          target: ${{ matrix.target }}

      - name: Attest published image
        if: github.event_name != 'pull_request'
        uses: actions/attest@v4
        with:
          push-to-registry: true
          subject-digest: ${{ steps.publish.outputs.digest }}
          subject-name: ${{ env.IMAGE_NAME }}

      - name: Report immutable image reference
        if: github.event_name != 'pull_request'
        run: |
          echo '`${{ env.IMAGE_NAME }}@${{ steps.publish.outputs.digest }}`' >> "${GITHUB_STEP_SUMMARY}"
